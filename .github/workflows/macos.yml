name: macOS PPU SIGBUS evidence
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [paired-signal]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record toolchain and fixed-sample evidence
        run: |
          sw_vers
          clang --version
          lldb --version
          python diagnostic_sigbus.py '${{ matrix.mode }}'
      - name: Collect native crash reports
        if: always()
        run: |
          mkdir -p sigbus-evidence/crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name '*thread-integration*' -exec cp '{}' sigbus-evidence/crash-reports/ \; || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sigbus-${{ matrix.mode }}
          path: sigbus-evidence
