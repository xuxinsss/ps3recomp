name: PPU formal fix negative controls
on:
  workflow_dispatch:
    inputs:
      owner:
        required: true
        type: string
      lifecycle:
        required: true
        type: string
jobs:
  prove:
    name: PPU contracts (${{ matrix.candidate }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        candidate: [owner, lifecycle]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.candidate == 'owner' && inputs.owner || inputs.lifecycle }}
          path: candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Negative controls and delayed-host verification
        env:
          CI: '1'
          EXPECTED_SHA: ${{ matrix.candidate == 'owner' && inputs.owner || inputs.lifecycle }}
        run: python validate_prio_candidate.py candidate "$EXPECTED_SHA"
