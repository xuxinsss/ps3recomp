name: macOS isolated PPU timing diagnostics
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect host toolchain
        run: |
          sw_vers
          clang --version
      - name: Repeat the unchanged upstream fixture and collect timings
        env:
          CI: '1'
        run: python diagnostic_prio_start.py
